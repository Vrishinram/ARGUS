  <text x="548" y="194" fill="#86EFAC" font-size="13" font-family="Inter,Segoe UI,Arial">• PII Redaction</text>
  <text x="548" y="218" fill="#93C5FD" font-size="13" font-family="Inter,Segoe UI,Arial">• Policy Risk Scoring</text>

  <rect x="828" y="138" width="200" height="88" rx="12" fill="#111827" stroke="#334155"/>
  <text x="846" y="168" fill="#E2E8F0" font-size="14" font-family="Inter,Segoe UI,Arial">Upstream LLM</text>
  <text x="846" y="190" fill="#A5B4FC" font-size="13" font-family="Inter,Segoe UI,Arial">OpenAI / Gemini / Mock</text>

  <rect x="528" y="332" width="240" height="130" rx="14" fill="#111827" stroke="#334155"/>
  <text x="548" y="366" fill="#E2E8F0" font-size="14" font-family="Inter,Segoe UI,Arial">Audit + SOC</text>
  <text x="548" y="392" fill="#93C5FD" font-size="13" font-family="Inter,Segoe UI,Arial">SQLite WAL incidents</text>
  <text x="548" y="415" fill="#93C5FD" font-size="13" font-family="Inter,Segoe UI,Arial">Live dashboard metrics</text>

  <g stroke="url(#accent)" stroke-width="4" filter="url(#glow)" fill="none" stroke-linecap="round">
    <path d="M220 182H272"/>
    <path d="M470 182H520"/>
    <path d="M770 182H820"/>
    <path d="M928 230V300H650V325"/>
    <path d="M650 280V325"/>
