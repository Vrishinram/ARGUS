  <rect x="278" y="138" width="190" height="88" rx="12" fill="#111827" stroke="#334155"/>
  <text x="296" y="168" fill="#E2E8F0" font-size="14" font-family="Inter,Segoe UI,Arial">Ingress Controls</text>
